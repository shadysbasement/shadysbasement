name: Refresh contribution animation

on:
  schedule:
    - cron: '27 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-cards
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install image renderer
        run: python -m pip install Pillow==11.3.0

      - name: Render real public contributions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/render_profile.py

      - name: Commit changed animation
        run: |
          git add assets/matrix-hero.gif assets/contributions.gif
          if git diff --cached --quiet; then
            echo "No public contributions changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh contribution animation"
          git push
